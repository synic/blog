---
name: Release and publish Docker image

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILD_CACHE: ghcr.io/${{ github.repository }}:buildcache

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  build-and-push-image:
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore generated images
        id: images-cache
        uses: actions/cache/restore@v5
        with:
          path: static/images
          key: images-${{ hashFiles('assets/images/**', 'assets/articles/**') }}
          restore-keys: |
            images-

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Install webp tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Build images
        run: go tool github.com/magefile/mage images:build

      # A cache saved from a tag run lands in a `refs/tags/*` scope that no
      # future run can read, so only save from the default branch. Tag runs
      # restore that same cache above.
      - name: Save generated images
        if: >-
          github.ref == 'refs/heads/main'
          && steps.images-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: static/images
          key: images-${{ hashFiles('assets/images/**', 'assets/articles/**') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache is not scoped to the ref, unlike type=gha, so a
          # tag build can reuse layers built on main.
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}
          cache-to: type=registry,ref=${{ env.BUILD_CACHE }},mode=max
