services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 2s
      timeout: 5s
      retries: 15

  blog:
    build:
      context: dev
      dockerfile: Dockerfile
    working_dir: /app
    command: go tool mage dev
    environment:
      DATABASE_URL: postgres://blog:blog@postgres:5432/blog?sslmode=disable
      HTTP_ADDRESS: ":3000"
      AIR_POLL: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - venv:/app/.venv
      - bin:/app/bin
      - airtmp:/app/.tmp
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    volumes:
      - ./dev/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    ports:
      - "8080:80"
    depends_on:
      - blog

volumes:
  pgdata:
  node_modules:
  venv:
  bin:
  airtmp:
  gomod:
  gobuild:
